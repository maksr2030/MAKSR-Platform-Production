name: Recover MAKSR live snapshot

on:
  push:
    branches:
      - source-recovery
    paths:
      - '.github/workflows/recover-live-snapshot.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: source-recovery

      - name: Fetch current live HTML without modifying production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/deployed-render-snapshot

          fetch_one() {
            local url="$1"
            local name="$2"
            curl --fail --location --retry 3 --retry-delay 2 \
              --user-agent 'Mozilla/5.0 MAKSR-Recovery/1.0' \
              --dump-header "recovery/deployed-render-snapshot/${name}-headers.txt" \
              --write-out '%{url_effective}\n%{http_code}\n%{size_download}\n' \
              "$url" \
              --output "recovery/deployed-render-snapshot/${name}.html" \
              > "recovery/deployed-render-snapshot/${name}-fetch.txt" || true
          }

          fetch_one 'https://maksr-3o8py7dio-maksr2030-6555s-projects.vercel.app/' 'deployment-direct'
          fetch_one 'https://www.maksr.com/' 'canonical-www'
          fetch_one 'https://maksr.com/' 'canonical-apex'

      - name: Classify fetched pages
        shell: bash
        run: |
          set -euo pipefail
          : > recovery/deployed-render-snapshot/CLASSIFICATION.txt
          for f in recovery/deployed-render-snapshot/*.html; do
            [ -s "$f" ] || continue
            name=$(basename "$f")
            if grep -Fq 'MAKSR' "$f" && grep -Fq 'Build. Invest. Partner. Acquire.' "$f"; then
              echo "$name=MAKSR_MATCH" >> recovery/deployed-render-snapshot/CLASSIFICATION.txt
            elif grep -Eiq 'vercel|authentication|login|sign in' "$f"; then
              echo "$name=VERCEL_OR_AUTH_PAGE" >> recovery/deployed-render-snapshot/CLASSIFICATION.txt
            else
              echo "$name=UNKNOWN" >> recovery/deployed-render-snapshot/CLASSIFICATION.txt
            fi
          done

      - name: Create evidence and SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          find recovery/deployed-render-snapshot -maxdepth 1 -type f -name '*.html' -print0 | sort -z | xargs -0 sha256sum > recovery/deployed-render-snapshot/SOURCE_MANIFEST_SHA256.txt || true
          {
            echo '# MAKSR Deployed Render Snapshot Evidence'
            echo
            echo 'This directory contains preservation snapshots fetched from the current public production endpoints.'
            echo 'These files are not yet represented as the original authoring source until source-view verification is completed.'
            echo
            echo '- Vercel deployment short ID observed in dashboard: 5KRnUzhDS'
            echo '- Direct deployment URL: https://maksr-3o8py7dio-maksr2030-6555s-projects.vercel.app/'
            echo '- Canonical domain: https://maksr.com/'
            echo '- Environment observed in dashboard: Production / Current / Ready'
            echo '- Deployment source observed in dashboard: vercel deploy'
            echo '- Source file list observed in dashboard: index.html, vercel.json'
            echo "- Recovery UTC timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'Safety: no Vercel deployment, alias, DNS, or production setting is changed by this workflow.'
          } > recovery/deployed-render-snapshot/RECOVERY_EVIDENCE.md

      - name: Commit snapshot to source-recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/deployed-render-snapshot
          if git diff --cached --quiet; then
            echo 'No snapshot changes to commit.'
          else
            git commit -m 'Preserve current MAKSR live render snapshots'
            git push origin source-recovery
          fi
