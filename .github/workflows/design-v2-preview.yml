name: MAKSR Design System v2 Preview Gate

on:
  push:
    branches:
      - design-system-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  design-preview-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --ignore-scripts --audit=false --fund=false

      - name: Run unit and design quality tests
        run: npm test
