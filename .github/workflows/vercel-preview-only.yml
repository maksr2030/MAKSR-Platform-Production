name: MAKSR Vercel preview only

on:
  workflow_dispatch:
  push:
    branches:
      - source-recovery
    paths:
      - 'PREVIEW_TRIGGER'

permissions:
  contents: write

env:
  VERCEL_TEAM_ID: team_KMM060bx6S1YZlqLGOqobs3R
  VERCEL_SCOPE: maksr2030-6555s-projects
  VERCEL_PROJECT_NAME: maksr-mvp

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified recovery source
        uses: actions/checkout@v4
        with:
          ref: source-recovery

      - name: Require Vercel token without exposing it
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'VERCEL_TOKEN repository secret is not configured.'
            exit 2
          fi

      - name: Reconfirm production source hash before preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/vercel-preview
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'Mozilla/5.0 MAKSR-Preview-Gate/1.0' \
            https://maksr.com/ \
            --output /tmp/maksr-live.html
          LIVE_SHA=$(sha256sum /tmp/maksr-live.html | awk '{print $1}')
          LOCAL_SHA=$(sha256sum index.html | awk '{print $1}')
          echo "LIVE_SHA=$LIVE_SHA" >> "$GITHUB_ENV"
          echo "LOCAL_SHA=$LOCAL_SHA" >> "$GITHUB_ENV"
          test "$LIVE_SHA" = "$LOCAL_SHA"

      - name: Verify exact Vercel project through team API
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .vercel
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_NAME}?teamId=${VERCEL_TEAM_ID}" \
            --output /tmp/vercel-project.json
          python3 - <<'PY'
          import json, os, sys
          p=json.load(open('/tmp/vercel-project.json'))
          expected_name=os.environ['VERCEL_PROJECT_NAME']
          expected_team=os.environ['VERCEL_TEAM_ID']
          if p.get('name') != expected_name:
              print(f"Unexpected Vercel project name: {p.get('name')}")
              sys.exit(3)
          project_id=p.get('id') or ''
          if not project_id.startswith('prj_'):
              print('Vercel API did not return a valid project id.')
              sys.exit(4)
          account_id=p.get('accountId') or expected_team
          print('Verified Vercel project:', expected_name, project_id)
          print('Verified Vercel account/team:', account_id)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f"DISCOVERED_PROJECT_ID={project_id}\n")
              f.write(f"DISCOVERED_ACCOUNT_ID={account_id}\n")
          os.makedirs('.vercel', exist_ok=True)
          with open('.vercel/project.json','w') as f:
              json.dump({'orgId': expected_team, 'projectId': project_id, 'projectName': expected_name}, f)
          PY

      - name: Pull existing Vercel project settings for Preview
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=preview \
            --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          python3 - <<'PY'
          import json, os
          p=json.load(open('.vercel/project.json'))
          assert p.get('projectId') == os.environ['DISCOVERED_PROJECT_ID'], (p.get('projectId'), os.environ['DISCOVERED_PROJECT_ID'])
          print('Existing Vercel project identity verified after pull.')
          PY

      - name: Build Preview only
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest build \
            --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Deploy Preview only, never Production
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(npx --yes vercel@latest deploy --prebuilt \
            --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN")
          echo "$URL" > recovery/vercel-preview/PREVIEW_URL.txt
          echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          echo "Created Preview: $URL"

      - name: Validate Preview content
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if curl --fail --location --retry 2 --retry-delay 2 \
            --user-agent 'Mozilla/5.0 MAKSR-Preview-Validation/1.0' \
            "$PREVIEW_URL" \
            --output recovery/vercel-preview/preview.html; then
            echo 'Preview was publicly readable.'
          else
            echo 'Direct Preview fetch is protected; retrying through authenticated Vercel CLI.'
            npx --yes vercel@latest curl "$PREVIEW_URL" \
              --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" \
              > recovery/vercel-preview/preview.html
          fi
          grep -Fq 'MAKSR' recovery/vercel-preview/preview.html
          grep -Fq 'Build. Invest. Partner. Acquire.' recovery/vercel-preview/preview.html
          PREVIEW_SHA=$(sha256sum recovery/vercel-preview/preview.html | awk '{print $1}')
          echo "PREVIEW_SHA=$PREVIEW_SHA" >> "$GITHUB_ENV"
          test "$PREVIEW_SHA" = "$LOCAL_SHA"

      - name: Record Preview evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# MAKSR Vercel Preview Evidence'
            echo
            echo "- Preview URL: $PREVIEW_URL"
            echo "- Vercel project name: $VERCEL_PROJECT_NAME"
            echo "- Vercel project ID: $DISCOVERED_PROJECT_ID"
            echo "- Vercel account/team ID: $DISCOVERED_ACCOUNT_ID"
            echo "- Vercel CLI scope: $VERCEL_SCOPE"
            echo "- Live source SHA-256: $LIVE_SHA"
            echo "- Recovered local SHA-256: $LOCAL_SHA"
            echo "- Preview response SHA-256: $PREVIEW_SHA"
            echo '- Source/live byte match before deploy: YES'
            echo '- Preview/local byte match after deploy: YES'
            echo '- Deployment mode: Preview only'
            echo '- Production flag used: NO'
            echo '- Production alias changed: NO'
            echo '- DNS changed: NO'
            echo "- UTC timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > recovery/vercel-preview/PREVIEW_EVIDENCE.md
          sha256sum recovery/vercel-preview/preview.html > recovery/vercel-preview/PREVIEW_SHA256.txt

      - name: Commit Preview evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/vercel-preview
          if git diff --cached --quiet; then
            echo 'No Preview evidence changes to commit.'
          else
            git commit -m 'Record MAKSR Vercel Preview evidence'
            git push origin source-recovery
          fi
