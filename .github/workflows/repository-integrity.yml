name: MAKSR Repository Integrity

on:
  push:
    branches:
      - main
      - source-recovery
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify mandatory governance files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f PRODUCTION-GOVERNANCE.md
          test -f SOURCE-RECOVERY.md
          test -f recovery/PRODUCTION-SOURCE-MANIFEST.json
          test -f recovery/CUTOVER-GATE.md
          test -f recovery/verify_recovered_source.py

      - name: Refuse committed environment secret files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(find . -type f \
            \( -name '.env' -o -name '.env.local' -o -name '.env.production' -o -name '.env.development' -o -name '.env.preview' \) \
            -not -path './.git/*' -print)"
          if [ -n "$forbidden" ]; then
            echo 'Forbidden environment files detected:'
            echo "$forbidden"
            exit 1
          fi

      - name: Validate recovery manifest JSON
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool recovery/PRODUCTION-SOURCE-MANIFEST.json >/dev/null

      - name: Compile recovery verifier
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile recovery/verify_recovered_source.py
